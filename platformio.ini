; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep
board_build.flash_mode = dio
board_build.flash_freq = 40m
lib_extra_dirs = DWNlib
lib_deps = 
	SPI
	Wire
	adafruit/Adafruit BusIO @ ^1.16.1
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit SSD1306 @ ^2.5.13
	adafruit/Adafruit ADS1X15 @ ^2.6.2
	file://DWNlib/ESP32-A2DP-1.8.11
build_flags =
	-DA2DP_LEGACY_I2S_SUPPORT=1
	-DESP_A2D_AUDIO_STATE_SUSPEND=ESP_A2D_AUDIO_STATE_REMOTE_SUSPEND

[env:native]
platform = native
build_flags =
	-Iinclude
	-IdWNlib/Adafruit_BusIO
	-IdWNlib/Adafruit_GFX_Library
	-IdWNlib/Adafruit_SSD1306
	-IdWNlib/Adafruit_ADS1X15
	-IdWNlib/ESP32-A2DP-1.8.11/src
	-DUNIT_TEST
lib_compat_mode = off
